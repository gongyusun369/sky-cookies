<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>하늘에서 쿠키가 내려와!</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Kirang+Haerang&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'NanumSquareRound';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NanumSquareRound.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --rose: #f87171;
            --rose-deep: #ef4444;
            --rose-light: #fecaca;
            --cream: #fff5f5;
        }

        * {
            font-family: 'NanumSquareRound', sans-serif;
            letter-spacing: -0.5px;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        .title-font {
            font-family: 'Kirang Haerang', cursive !important;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            width: 100%;
            height: 100%;
            height: 100dvh; /* dynamic viewport height - 모바일 주소창 대응 */
        }

        body {
            background-color: var(--cream);
        }

        /* =========================================
           공통 화면 구조
        ========================================= */
        .screen {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            height: 100dvh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        .active { display: flex; }

        .pink-bg {
            background: linear-gradient(160deg, #ff9a9e 0%, #fad0c4 100%);
        }

        /* =========================================
           1. 시작 화면
        ========================================= */
        #start-screen {
            padding: env(safe-area-inset-top, 16px) 20px env(safe-area-inset-bottom, 16px);
            justify-content: space-between;
        }

        #start-bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .start-content {
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 0 16px;
            gap: clamp(12px, 3vw, 24px);
            justify-content: center;
            flex: 1;
        }

        .start-title {
            font-family: 'Kirang Haerang', cursive;
            color: white;
            text-align: center;
            line-height: 1.2;
            drop-shadow: 0 4px 16px rgba(0,0,0,0.2);
            /* 화면 크기에 따라 유동적으로 */
            font-size: clamp(2.4rem, 10vw, 5rem);
            margin: 0;
        }

        .start-cookie-icon {
            font-size: clamp(3rem, 12vw, 6rem);
            animation: float 2s ease-in-out infinite;
            line-height: 1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #cam-status {
            font-size: clamp(0.85rem, 3.5vw, 1.1rem);
            color: white;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: bold;
            text-align: center;
            margin: 0;
            max-width: 90%;
        }

        #start-btn {
            background: white;
            color: var(--rose-deep);
            border: 4px solid rgba(255,255,255,0.6);
            padding: clamp(14px, 3vw, 20px) clamp(40px, 10vw, 80px);
            border-radius: 999px;
            font-size: clamp(1.3rem, 5vw, 2rem);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            font-family: 'Kirang Haerang', cursive;
            width: 80%;
            max-width: 320px;
        }
        #start-btn:not(:disabled):active {
            transform: scale(0.96);
        }
        #start-btn:disabled { opacity: 0.5; }

        /* =========================================
           2. 설정 화면
        ========================================= */
        #settings-screen {
            background: white;
            padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 16px);
            justify-content: flex-start;
            align-items: stretch;
        }

        .settings-inner {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(16px, 4vw, 32px) clamp(16px, 5vw, 32px);
            gap: clamp(14px, 3vw, 24px);
        }

        .settings-title {
            font-family: 'Kirang Haerang', cursive;
            color: var(--rose);
            font-size: clamp(1.8rem, 7vw, 3rem);
            margin: 0;
            text-align: center;
        }

        .setting-section {
            width: 100%;
        }

        .setting-label {
            font-size: clamp(0.95rem, 3.5vw, 1.25rem);
            font-weight: bold;
            color: #444;
            margin-bottom: 10px;
            font-family: 'Kirang Haerang', cursive;
        }

        .btn-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .config-btn {
            background: white;
            border: 3px solid var(--rose-light);
            padding: clamp(10px, 2.5vw, 16px) 8px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }
        .config-btn .emoji {
            font-size: clamp(1.8rem, 7vw, 3rem);
            line-height: 1;
        }
        .config-btn .label {
            font-size: clamp(0.75rem, 2.8vw, 1rem);
            color: #555;
        }
        .config-btn.selected {
            background: var(--rose);
            border-color: var(--rose-deep);
            color: white;
            transform: scale(1.03);
            box-shadow: 0 6px 16px rgba(248, 113, 113, 0.35);
        }
        .config-btn.selected .label { color: white; }

        /* 슬라이더 */
        .time-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .time-row .setting-label { margin-bottom: 0; }
        #time-val {
            color: var(--rose);
            font-family: 'Kirang Haerang', cursive;
            font-size: clamp(1rem, 4vw, 1.4rem);
            white-space: nowrap;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 20px;
            background: #fee2e2;
            border-radius: 15px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: clamp(32px, 7vw, 44px);
            height: clamp(32px, 7vw, 44px);
            background: var(--rose);
            border-radius: 50%;
            cursor: pointer;
            border: 4px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .range-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            font-size: clamp(0.75rem, 2.8vw, 0.9rem);
            color: #aaa;
            font-weight: bold;
        }

        .confirm-btn {
            background: var(--rose);
            color: white;
            border: none;
            padding: clamp(14px, 3vw, 18px) 0;
            border-radius: 999px;
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
            transition: all 0.15s;
            box-shadow: 0 6px 20px rgba(248, 113, 113, 0.35);
            font-family: 'Kirang Haerang', cursive;
            margin-top: 4px;
        }
        .confirm-btn:active { transform: scale(0.97); }

        /* =========================================
           3. 게임 컨테이너
        ========================================= */
        #game-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            height: 100dvh;
            background: #000;
            overflow: hidden;
        }

        video, #canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* 준비 오버레이 */
        #ready-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.55);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 60;
            padding: 20px;
        }

        .ready-card {
            background: white;
            padding: clamp(24px, 5vw, 48px) clamp(20px, 5vw, 40px);
            border-radius: 40px;
            text-align: center;
            border: 6px solid #fca5a5;
            box-shadow: 0 24px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 360px;
        }

        .ready-card h2 {
            font-family: 'Kirang Haerang', cursive;
            color: var(--rose);
            font-size: clamp(1.6rem, 6vw, 2.5rem);
            margin: 0 0 12px;
        }

        .ready-card p {
            color: #555;
            font-size: clamp(0.9rem, 3.5vw, 1.2rem);
            font-weight: bold;
            line-height: 1.7;
            margin: 0 0 20px;
        }

        .ready-start-btn {
            background: var(--rose);
            color: white;
            border: none;
            padding: clamp(12px, 3vw, 16px) clamp(28px, 6vw, 48px);
            border-radius: 999px;
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            font-weight: bold;
            font-family: 'Kirang Haerang', cursive;
            cursor: pointer;
            animation: bounce 1s infinite;
            box-shadow: 0 6px 20px rgba(248, 113, 113, 0.4);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* 팀 라벨 */
        .team-tag {
            position: absolute;
            top: max(env(safe-area-inset-top), 12px);
            padding: 6px 18px;
            border-radius: 999px;
            font-size: clamp(1rem, 4vw, 1.6rem);
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 30;
            font-family: 'Kirang Haerang', cursive;
        }

        /* 점수 표시 */
        .score-display {
            position: absolute;
            color: white;
            font-family: 'Kirang Haerang', cursive;
            font-size: clamp(2.4rem, 10vw, 5rem);
            text-shadow: 0 4px 12px rgba(0,0,0,0.4), 0 0 0 4px rgba(0,0,0,0.1);
            z-index: 30;
            display: none;
        }

        #score-a-display {
            top: clamp(52px, 12vw, 90px);
            left: clamp(12px, 4vw, 40px);
        }

        #score-b-display {
            top: clamp(52px, 12vw, 90px);
            right: clamp(12px, 4vw, 40px);
        }

        /* 타이머 */
        #timer {
            position: absolute;
            top: max(env(safe-area-inset-top), 10px);
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: clamp(6px, 1.5vw, 10px) clamp(20px, 5vw, 40px);
            border-radius: 999px;
            font-size: clamp(1.4rem, 6vw, 2.5rem);
            color: #dc2626;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            border: 3px solid #fecaca;
            font-family: 'Kirang Haerang', cursive;
            z-index: 35;
            white-space: nowrap;
        }

        /* 구분선 */
        #divider {
            position: absolute;
            left: 50%;
            top: 0; bottom: 0;
            width: 4px;
            border-left: 4px dashed rgba(255,255,255,0.55);
            transform: translateX(-50%);
            display: none;
            z-index: 25;
        }

        /* 보너스 알림 */
        @keyframes bonus-pulse {
            0%, 100% { transform: translateX(-50%) scale(1); box-shadow: 0 0 20px rgba(251,191,36,0.4); }
            50% { transform: translateX(-50%) scale(1.08); box-shadow: 0 0 40px rgba(251,191,36,0.8); }
        }

        #bonus-alert {
            position: absolute;
            top: clamp(90px, 20vw, 150px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,253,231,0.96);
            color: #b45309;
            padding: 8px 28px;
            border-radius: 20px;
            font-size: clamp(1.2rem, 5vw, 2.2rem);
            display: none;
            z-index: 100;
            border: 4px solid #fcd34d;
            font-family: 'Kirang Haerang', cursive;
            animation: bonus-pulse 1s infinite ease-in-out;
            white-space: nowrap;
        }

        /* =========================================
           4. 결과 화면
        ========================================= */
        #result-screen {
            padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 20px);
            justify-content: flex-start;
            gap: 0;
            overflow-y: auto;
        }

        .result-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            gap: clamp(12px, 3vw, 20px);
            padding-bottom: 8px;
        }

        .result-title {
            font-family: 'Kirang Haerang', cursive;
            color: white;
            font-size: clamp(2rem, 8vw, 4rem);
            text-align: center;
            margin: 0;
            text-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .result-cards {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .result-card {
            flex: 1;
            background: white;
            border-radius: 28px;
            padding: clamp(16px, 4vw, 28px) 12px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0,0,0,0.12);
        }

        #result-card-a { border: 5px solid #fca5a5; }
        #result-card-b { border: 5px solid #93c5fd; display: none; }

        .card-label {
            font-family: 'Kirang Haerang', cursive;
            font-size: clamp(1rem, 4vw, 1.5rem);
            margin-bottom: 8px;
        }
        #label-a-final { color: #dc2626; }

        .card-score {
            font-family: 'Kirang Haerang', cursive;
            font-size: clamp(2.8rem, 12vw, 5.5rem);
            font-weight: bold;
            line-height: 1;
        }
        #result-card-a .card-score { color: #ef4444; }
        #result-card-b .card-score { color: #3b82f6; }

        .score-unit {
            font-size: 0.55em;
        }

        .result-message-box {
            background: rgba(255,255,255,0.92);
            padding: clamp(16px, 4vw, 24px) clamp(16px, 4vw, 24px);
            border-radius: 28px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        #praise-msg {
            font-size: clamp(0.85rem, 3.2vw, 1.05rem);
            color: #444;
            line-height: 1.75;
            text-align: center;
            font-weight: bold;
            margin: 0 0 10px;
        }

        #final-cheer {
            font-family: 'Kirang Haerang', cursive;
            color: var(--rose);
            font-size: clamp(1rem, 4.5vw, 1.8rem);
            font-weight: bold;
            text-align: center;
            animation: bounce 1.2s ease-in-out infinite;
        }

        #total-score-box {
            display: none;
            margin-top: 10px;
            background: #fefce8;
            border: 3px solid #fde68a;
            border-radius: 16px;
            padding: clamp(10px, 2.5vw, 16px);
            text-align: center;
            font-family: 'Kirang Haerang', cursive;
            font-size: clamp(1rem, 4vw, 1.6rem);
            color: #b45309;
            font-weight: bold;
        }

        .restart-btn {
            background: white;
            color: var(--rose-deep);
            border: none;
            padding: clamp(14px, 3vw, 18px) 0;
            border-radius: 999px;
            font-size: clamp(1.1rem, 4.5vw, 1.6rem);
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            transition: all 0.15s;
            font-family: 'Kirang Haerang', cursive;
        }
        .restart-btn:active { transform: scale(0.97); }

    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- 1. 시작 화면 -->
    <div id="start-screen" class="screen active pink-bg">
        <canvas id="start-bg-canvas"></canvas>
        <div class="start-content">
            <div class="start-cookie-icon">🍪</div>
            <h1 class="start-title">하늘에서<br>쿠키가 내려와!</h1>
            <p id="cam-status">얼굴을 움직여서 떨어지는 간식을 냠냠 먹어보아요!</p>
            <button id="start-btn" onclick="goToSettings()" disabled>
                🍩 준비하기
            </button>
        </div>
    </div>

    <!-- 2. 설정 화면 -->
    <div id="settings-screen" class="screen">
        <div class="settings-inner">
            <h2 class="settings-title">🍭 놀이 규칙을 정해요</h2>

            <div class="setting-section">
                <p class="setting-label">👩‍👧‍👦 누구와 놀이할까요?</p>
                <div class="btn-grid-2">
                    <button class="config-btn mode-btn selected" onclick="setMode('together', this)">
                        <span class="emoji">🤝</span>
                        <span class="label">함께 모드</span>
                    </button>
                    <button class="config-btn mode-btn" onclick="setMode('battle', this)">
                        <span class="emoji">⚔️</span>
                        <span class="label">대결 모드</span>
                    </button>
                </div>
            </div>

            <div class="setting-section">
                <p class="setting-label">🎨 어떤 쿠키를 먹을까요?</p>
                <div class="btn-grid-3">
                    <button class="config-btn content-btn selected" onclick="setContent('snack', this)">
                        <span class="emoji">🍭</span>
                        <span class="label">다양한 간식</span>
                    </button>
                    <button class="config-btn content-btn" onclick="setContent('number', this)">
                        <span class="emoji">7️⃣</span>
                        <span class="label">숫자 쿠키</span>
                    </button>
                    <button class="config-btn content-btn" onclick="setContent('korean', this)">
                        <span class="emoji" style="font-size:clamp(1.4rem,5.5vw,2.2rem);font-family:sans-serif;">ㄱ</span>
                        <span class="label">한글 쿠키</span>
                    </button>
                </div>
            </div>

            <div class="setting-section">
                <div class="time-row">
                    <p class="setting-label">⏰ 얼마나 놀이할까요?</p>
                    <span id="time-val">45초</span>
                </div>
                <input type="range" min="20" max="120" value="45" step="5" oninput="setTime(this.value)">
                <div class="range-labels">
                    <span>20초</span>
                    <span>120초</span>
                </div>
            </div>

            <button onclick="goToReady()" class="confirm-btn">설정 완료! 🎉</button>
        </div>
    </div>

    <!-- 3. 게임 화면 -->
    <div id="game-container" style="display:none;">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="canvas"></canvas>
        <div id="divider"></div>
        
        <div id="ready-overlay">
            <div class="ready-card">
                <h2>준비 운동을 해요!</h2>
                <p>내 얼굴이 보이나요?<br>얼굴을 움직여서<br>간식을 잡아요!</p>
                <button class="ready-start-btn" onclick="startGame()">준비 됐어요!</button>
            </div>
        </div>

        <div id="team-a-label" class="team-tag" style="left: 12px; display: none; background-color: #4ade80;">🤝 함께해요</div>
        <div id="team-b-label" class="team-tag" style="right: 12px; display: none; background-color: #3b82f6;">💙 파랑팀</div>
        
        <div id="score-a-display" class="score-display">0</div>
        <div id="score-b-display" class="score-display">0</div>
        
        <div id="timer" class="title-font">45</div>
        <div id="bonus-alert">🌟 보너스 2배 🌟</div>
    </div>

    <!-- 4. 결과 화면 -->
    <div id="result-screen" class="screen pink-bg">
        <div class="result-inner">
            <h2 class="result-title">와! 다 먹었다! 🎊</h2>

            <div class="result-cards">
                <div id="result-card-a" class="result-card">
                    <div id="label-a-final" class="card-label">❤️ 빨강팀</div>
                    <div class="card-score" style="color:#ef4444;"><span id="slot-a">0</span><span class="score-unit">점</span></div>
                </div>
                <div id="result-card-b" class="result-card">
                    <div class="card-label" style="color:#2563eb;">💙 파랑팀</div>
                    <div class="card-score" style="color:#3b82f6;"><span id="slot-b">0</span><span class="score-unit">점</span></div>
                </div>
            </div>

            <div class="result-message-box">
                <p id="praise-msg"></p>
                <div id="final-cheer"></div>
                <div id="total-score-box">
                    우리의 합계: <span id="total-val">0</span>점
                </div>
            </div>

            <button class="restart-btn" onclick="location.reload()">🔄 처음으로 돌아가기</button>
        </div>
    </div>

    <script>
        let config = { mode: 'together', content: 'snack', time: 45 };
        const contents = {
            snack: ['🍪', '🍩', '🍰', '🥨', '🍭', '🥐', '🧁', '🍦', '🍡', '🍮'],
            number: ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'],
            korean: ['가', '나', '다', '라', '마', '바', '사', '아', '자', '차', '카', '타','파','하']
        };
        const colors = ['#FFADAD', '#FFD6A5', '#FDFFB6', '#CAFFBF', '#9BF6FF', '#A0C4FF', '#BDB2FF', '#FFC6FF'];
        const shapes = ['circle', 'rect', 'roundedRect'];
        const mouthColors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];

        let scoreA = 0, scoreB = 0, timeLeft = 45;
        let gameActive = false, isBonus = false;
        let cookies = [];
        let facePositions = [];

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startCanvas = document.getElementById('start-bg-canvas');
        const startCtx = startCanvas.getContext('2d');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        let bgmInterval, bgmTick = 0;
        const melody = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 293.66, 392.00, 261.63, 392.00, 523.25, 493.88, 440.00, 392.00, 349.23, 329.63];
        const chords = [[130.81, 164.81, 196.00], [174.61, 220.00, 261.63], [196.00, 246.94, 293.66], [130.81, 164.81, 196.00]];

        function startBGM() {
            if (bgmInterval) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            bgmTick = 0;
            bgmInterval = setInterval(() => {
                const note = melody[bgmTick % melody.length];
                playTone(note, 'triangle', 0.2, 0.06);
                if (bgmTick % 4 === 0) {
                    chords[(bgmTick / 4) % chords.length].forEach(f => playTone(f, 'sine', 0.8, 0.03));
                }
                bgmTick++;
            }, 250);
        }

        function stopBGM() { clearInterval(bgmInterval); bgmInterval = null; }

        function playTone(freq, type, duration, volume = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function playSound(freq, type = 'sine', duration = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            playTone(freq, type, duration);
        }

        let startCookies = [];

        function resizeCanvases() {
            canvas.width = startCanvas.width = window.innerWidth;
            canvas.height = startCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        function drawStartScreenAnimation() {
            if (document.getElementById('start-screen').classList.contains('active')) {
                startCtx.clearRect(0, 0, startCanvas.width, startCanvas.height);
                if (Math.random() < 0.05) {
                    startCookies.push({
                        x: Math.random() * startCanvas.width,
                        y: -100,
                        char: contents.snack[Math.floor(Math.random() * contents.snack.length)],
                        speed: 2 + Math.random() * 3,
                        angle: Math.random() * Math.PI * 2,
                        rot: (Math.random() - 0.5) * 0.05
                    });
                }
                for (let i = startCookies.length - 1; i >= 0; i--) {
                    let sc = startCookies[i];
                    sc.y += sc.speed; sc.angle += sc.rot;
                    startCtx.save();
                    startCtx.translate(sc.x, sc.y);
                    startCtx.rotate(sc.angle);
                    startCtx.font = "50px Kirang Haerang";
                    startCtx.textAlign = "center";
                    startCtx.fillText(sc.char, 0, 0);
                    startCtx.restore();
                    if (sc.y > startCanvas.height + 100) startCookies.splice(i, 1);
                }
                requestAnimationFrame(drawStartScreenAnimation);
            }
        }
        drawStartScreenAnimation();

        window.onload = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                video.srcObject = stream;
                document.getElementById('start-btn').disabled = false;
            } catch (err) {
                console.error("Camera error:", err);
                if (err.name === 'NotReadableError' || err.name === 'OverconstrainedError') {
                    try {
                        const simpleStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                        video.srcObject = simpleStream;
                        document.getElementById('start-btn').disabled = false;
                    } catch (retryErr) {
                        document.getElementById('cam-status').innerText = "카메라가 다른 곳에서 사용 중이거나 연결이 안 돼요!";
                    }
                } else {
                    document.getElementById('cam-status').innerText = "카메라를 켤 수 없어요. 설정을 확인해 주세요!";
                }
            }
        };

        function setMode(m, el) {
            config.mode = m;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
        }
        function setContent(c, el) {
            config.content = c;
            document.querySelectorAll('.content-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
        }
        function setTime(val) {
            config.time = parseInt(val);
            document.getElementById('time-val').innerText = val + "초";
        }

        function goToSettings() {
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('settings-screen').classList.add('active');
        }

        function goToReady() {
            document.getElementById('settings-screen').classList.remove('active');
            document.getElementById('game-container').style.display = 'block';
            const teamA = document.getElementById('team-a-label');
            if (config.mode === 'battle') {
                document.getElementById('divider').style.display = 'block';
                teamA.style.backgroundColor = '#ef4444';
                teamA.innerText = "❤️ 빨강팀";
            } else {
                document.getElementById('divider').style.display = 'none';
                teamA.style.backgroundColor = '#4ade80';
                teamA.innerText = "🤝 함께해요";
            }
            resizeCanvases();
            initFaceMesh();
        }

        function startGame() {
            startBGM();
            document.getElementById('ready-overlay').style.display = 'none';
            gameActive = true; timeLeft = config.time;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('team-a-label').style.display = 'block';
            document.getElementById('score-a-display').style.display = 'block';
            if (config.mode === 'battle') {
                document.getElementById('team-b-label').style.display = 'block';
                document.getElementById('score-b-display').style.display = 'block';
            }
            const timerInt = setInterval(() => {
                if (!gameActive) { clearInterval(timerInt); return; }
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft === 10) {
                    isBonus = true;
                    document.getElementById('bonus-alert').style.display = 'block';
                    setTimeout(() => {
                        const el = document.getElementById('bonus-alert');
                        if (el) el.style.display = 'none';
                    }, 3000);
                }
                if (timeLeft <= 0) { gameActive = false; endGame(); }
            }, 1000);
        }

        function initFaceMesh() {
            const faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });
            faceMesh.setOptions({ maxNumFaces: 4, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            faceMesh.onResults(onResults);

            const camera = new Camera(video, {
                onFrame: async () => { await faceMesh.send({ image: video }); },
                width: { ideal: 1280 }, height: { ideal: 720 }
            });
            camera.start().catch(() => {
                const simpleCamera = new Camera(video, {
                    onFrame: async () => { await faceMesh.send({ image: video }); }
                });
                simpleCamera.start();
            });
        }

        function onResults(results) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            facePositions = [];
            if (results.multiFaceLandmarks) {
                results.multiFaceLandmarks.forEach((landmarks, index) => {
                    let minX = 1, maxX = 0, minY = 1, maxY = 0;
                    landmarks.forEach(p => {
                        if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
                        if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
                    });
                    const centerX = ((minX + maxX) / 2) * canvas.width;
                    const centerY = ((minY + maxY) / 2) * canvas.height;
                    const faceWidth = (maxX - minX) * canvas.width;
                    const faceHeight = (maxY - minY) * canvas.height;
                    const radius = Math.max(faceWidth, faceHeight) * 0.8;
                    let team = (centerX < canvas.width / 2) ? 0 : 1;
                    if (config.mode === 'together') team = 0;
                    const displayColor = (config.mode === 'battle') ? (team === 0 ? '#ef4444' : '#3b82f6') : mouthColors[index % mouthColors.length];
                    facePositions.push({ x: centerX, y: centerY, radius, team });
                    drawFaceSensor(centerX, centerY, radius, displayColor);
                });
            }
            if (gameActive) updateObjects();
        }

        function drawFaceSensor(x, y, radius, color) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.lineWidth = 6;
            ctx.strokeStyle = "white";
            ctx.stroke();
            ctx.fillStyle = color + "55";
            ctx.fill();
            ctx.fillStyle = "white";
            ctx.font = `bold ${Math.max(20, radius * 0.35)}px Kirang Haerang`;
            ctx.textAlign = "center";
            ctx.fillText("냠냠!", x, y - radius - 10);
        }

        function updateObjects() {
            if (Math.random() < (isBonus ? 0.2 : 0.1)) {
                cookies.push({
                    x: Math.random() * (canvas.width - 120) + 60,
                    y: -100,
                    char: isBonus && Math.random() > 0.7 ? '🌟' : contents[config.content][Math.floor(Math.random() * contents[config.content].length)],
                    speed: 5 + Math.random() * 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    shape: shapes[Math.floor(Math.random() * shapes.length)]
                });
            }

            /* 쿠키 크기: 화면 너비에 비례 */
            const size = Math.min(canvas.width * 0.22, 110);
            const fontSize = Math.round(size * 0.58);

            for (let i = cookies.length - 1; i >= 0; i--) {
                let c = cookies[i];
                c.y += c.speed;
                ctx.fillStyle = c.color; ctx.strokeStyle = "white"; ctx.lineWidth = 3;
                if (c.char === '🌟') {
                    ctx.font = `${fontSize + 30}px Kirang Haerang`;
                    ctx.textAlign = "center";
                    ctx.fillText(c.char, c.x, c.y + Math.round(fontSize * 0.4));
                } else {
                    ctx.beginPath();
                    if (c.shape === 'circle') ctx.arc(c.x, c.y, size / 2, 0, Math.PI * 2);
                    else if (c.shape === 'rect') ctx.rect(c.x - size/2, c.y - size/2, size, size);
                    else ctx.roundRect(c.x - size/2, c.y - size/2, size, size, 16);
                    ctx.fill(); ctx.stroke();
                    ctx.fillStyle = "#333";
                    ctx.font = `${fontSize}px Kirang Haerang`;
                    ctx.textAlign = "center";
                    ctx.fillText(c.char, c.x, c.y + Math.round(fontSize * 0.33));
                }

                facePositions.forEach((f) => {
                    if (Math.hypot(f.x - c.x, f.y - c.y) < f.radius + 20) {
                        const p = c.char === '🌟' ? 10 : 1;
                        if (f.team === 0) { scoreA += p; document.getElementById('score-a-display').innerText = scoreA; }
                        else { scoreB += p; document.getElementById('score-b-display').innerText = scoreB; }
                        playSound(f.team === 0 ? 523.25 : 659.25, 'sine', 0.1);
                        cookies.splice(i, 1);
                    }
                });
                if (c.y > canvas.height + 150) cookies.splice(i, 1);
            }
        }

        function runSlot(targetId, finalValue) {
            const el = document.getElementById(targetId);
            if (!el) return;
            const start = performance.now();
            function update(now) {
                const progress = Math.min((now - start) / 2500, 1);
                el.innerText = Math.floor(progress * finalValue);
                if (progress < 1) requestAnimationFrame(update);
                else el.innerText = finalValue;
            }
            requestAnimationFrame(update);
        }

        function endGame() {
            stopBGM();
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('result-screen').classList.add('active');

            if (config.mode === 'battle') {
                document.getElementById('result-card-b').style.display = 'block';
                document.getElementById('label-a-final').innerText = "❤️ 빨강팀";
                document.getElementById('label-a-final').style.color = '#dc2626';
                runSlot('slot-a', scoreA); runSlot('slot-b', scoreB);
                document.getElementById('praise-msg').innerText = `서로 정정당당하게 놀이하는 모습이 정말 멋져요! 끝까지 포기하지 않고 집중해서 간식을 모은 우리 친구들, 최고예요!`;
                document.getElementById('final-cheer').innerText = "함께 놀아준 친구에게 '고마워!'라고 인사해요!";
                document.getElementById('total-score-box').style.display = 'block';
                document.getElementById('total-val').innerText = scoreA + scoreB;
            } else {
                document.getElementById('label-a-final').innerText = "🤝 함께해요";
                document.getElementById('label-a-final').style.color = '#16a34a';
                runSlot('slot-a', scoreA);
                document.getElementById('praise-msg').innerText = `우와! 우리 친구들이 힘을 합쳐서 하늘에서 내려오는 간식을 이렇게나 많이 모았네요! 적극적으로 참여하는 모습이 대견해요!`;
                document.getElementById('final-cheer').innerText = "'열심히 참여한 나! 정말 최고야✨'라고 외쳐봐요!";
            }

            confetti({ particleCount: 300, spread: 100, origin: { y: 0.5 } });
            playTone(523.25, 'square', 0.2, 0.1);
            setTimeout(() => playTone(659.25, 'square', 0.2, 0.1), 150);
            setTimeout(() => playTone(783.99, 'square', 0.5, 0.1), 300);
        }
    </script>
</body>
